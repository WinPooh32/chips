name: Lint

on:
  pull_request:
  push:
    branches:
      - main
      - master

env:
  GO_VERSION: "1.26.x"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go tool modules
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/go/pkg/mod
            misc/bin/
          key: ${{ runner.os }}-go-${{ env.GO_VERSION }}-tools-${{ hashFiles('tools/*-go.mod', 'tools/*-go.sum', 'tools/scripts/install-typos.sh', 'tools/scripts/scc-threshold.sh') }}
          restore-keys: |
            ${{ runner.os }}-go-tools-

      - run: make install/tools

      - run: make lint/ci
