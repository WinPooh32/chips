name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - master

env:
  GO_VERSION: "1.26.x"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - run: go test ./...
